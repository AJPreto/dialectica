[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectica"
version = "0.1.0"
description = "Natural language to logical blocks prototype."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Marti" }
]
dependencies = []

[project.scripts]
dialectica = "dialectica.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
