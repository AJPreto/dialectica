[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectica"
version = "0.1.0"
description = "Natural-language logical-form tooling with deterministic evaluation helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "A. J. Preto" }
]
keywords = ["logic", "reasoning", "nlp", "llm", "knowledge-representation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AJPreto/dialectica"

[project.scripts]
dialectica = "dialectica.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dialectica = ["py.typed"]
